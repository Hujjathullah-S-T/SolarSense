services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: solarsense
      POSTGRES_USER: solarsense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solarsense-dev}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarsense"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://solarsense:${POSTGRES_PASSWORD:-solarsense-dev}@db:5432/solarsense
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  postgres_data:
